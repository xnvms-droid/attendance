<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>출석 스캐너</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  html, body { height: 100%; }
  body { background: #000; color: #fff; overflow: hidden; }
  /* ① 시작 화면: 화면 전체가 버튼 */
  #startView { position: fixed; inset: 0; display: flex; flex-direction: column; padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); gap: 12px; }
  #startView .info { text-align: center; font-size: 15px; color: #cfd3da; }
  #startView .info b { color: #fff; font-size: 20px; }
  #startBtn {
    flex: 1; border: 0; border-radius: 28px; background: #19c463; color: #fff; font-size: 44px; font-weight: 900;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; cursor: pointer;
  }
  #startBtn small { font-size: 17px; font-weight: 600; opacity: .9; }
  #startBtn:disabled { background: #3a3f47; }
  #startMsg { text-align: center; font-size: 15px; min-height: 22px; color: #ffd166; }

  /* ② 스캔 화면 */
  #scanView { position: fixed; inset: 0; display: none; }
  body.scanning #scanView { display: block; }
  body.scanning #startView { display: none; }
  #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .top {
    position: absolute; left: 0; right: 0; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px;
    padding: calc(6px + env(safe-area-inset-top)) 10px 6px; background: rgba(0,0,0,.55); font-size: 14px;
  }
  .top .count { font-size: 22px; font-weight: 900; }
  .top .sp { flex: 1; }
  .top button { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.4); border-radius: 10px; padding: 8px 12px; font-size: 14px; font-weight: 700; }
  .pending { font-size: 12px; opacity: .85; }
  .pending.warn { color: #ffd166; opacity: 1; font-weight: 700; }
  .guide { position: absolute; left: 50%; top: 50%; width: 72vmin; height: 72vmin; transform: translate(-50%, -50%); border: 3px dashed rgba(255,255,255,.7); border-radius: 24px; z-index: 3; pointer-events: none; }
  .frame { position: absolute; inset: 0; border: 0 solid transparent; pointer-events: none; z-index: 4; }
  .frame.ok { border: 18px solid #19c463; }
  .frame.dup { border: 18px solid #ffb020; }
  .frame.bad { border: 18px solid #ff3344; }
  .result {
    position: absolute; left: 10px; right: 10px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 5;
    border-radius: 18px; padding: 16px; text-align: center; background: rgba(0,0,0,.6);
  }
  .result .main { font-size: 34px; font-weight: 900; line-height: 1.2; }
  .result .sub { font-size: 16px; margin-top: 4px; white-space: pre-line; }
  .result.ok { background: #138a4a; }
  .result.dup { background: #b9770e; }
  .result.bad { background: #c0182a; }

  /* ③ 수동 출석·출석 취소 */
  .panel { position: fixed; inset: 0; background: var(--bg); color: var(--text); z-index: 20; display: none; overflow: auto; }
  .panel.show { display: block; }
  .person { display: flex; align-items: center; justify-content: space-between; padding: 12px 4px; border-bottom: 1px solid var(--line); gap: 8px; }
  .person .nm { font-weight: 700; font-size: 17px; }
  .person .st { font-size: 13px; color: var(--muted); }
  .person button { padding: 10px 12px; border-radius: 10px; border: 0; font-weight: 700; font-size: 14px; white-space: nowrap; }
  .person .do { background: var(--primary); color: #fff; }
  .person .undo { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
  .faillog { font-size: 13px; }
</style>
</head>
<body>
<!-- ① 시작 -->
<div id="startView">
  <div class="info" id="info">명단을 불러오는 중입니다…</div>
  <button id="startBtn" type="button" disabled>스캔 시작<small>누르면 카메라가 켜집니다</small></button>
  <div id="startMsg"></div>
</div>

<!-- ② 스캔 -->
<div id="scanView">
  <video id="video" playsinline muted></video>
  <div class="guide"></div>
  <div class="frame" id="frame"></div>
  <div class="top">
    <div>
      <div><span id="roundLbl"></span> 출석 <span class="count" id="cnt">0</span>/<span id="tot">0</span></div>
      <div class="pending" id="pend">미전송 0</div>
    </div>
    <div class="sp"></div>
    <button id="torchBtn" type="button" hidden>조명</button>
    <button id="manualBtn" type="button">수동·취소</button>
  </div>
  <div class="result" id="result"><div class="main">QR을 비춰 주세요</div><div class="sub" id="resultSub"></div></div>
</div>

<!-- ③ 수동 출석 · 출석 취소 -->
<div class="panel" id="manualPanel">
  <div class="wrap">
    <h1>수동 출석 · 출석 취소</h1>
    <p class="muted" style="margin-top:-6px">휴대폰이 없는 분은 [출석 처리], 잘못 처리된 분은 [출석 취소]를 누르세요.</p>
    <input id="search" type="search" placeholder="이름 검색">
    <div id="list"></div>
    <h2 style="margin-top:18px">처리 실패 기록</h2>
    <div id="faillog" class="faillog muted">없음</div>
    <button class="btn" id="closeManual" type="button">스캔 화면으로 돌아가기</button>
  </div>
</div>

<script src="config.js"></script>
<script src="assets/common.js"></script>
<script type="module">
import QrScanner from './vendor/qr-scanner.min.js';

const { api, hmac, store, hhmmss, esc } = window.APP;
const $ = (id) => document.getElementById(id);

// 기기 구분용 이름 자동 생성 (예: 기기A7K)
let dev = store.get('scan_dev');
if (!dev) { dev = '기기' + Math.random().toString(36).slice(2, 5).toUpperCase(); store.set('scan_dev', dev); }

const S = {
  key: APP.staffKey(), dev,
  round: '', secret: '', valid: 300, grace: 15, future: 90,
  roster: new Map(),     // 주문번호 → {name, birth, att, seat, status}
  queue: store.getJSON('scan_queue') || [],
  inflight: false,
  recent: new Map(),
  fails: [],
  scanner: null,
  audio: null,
  ready: false
};

// ---------- 소리·진동 ----------
function beep(type) {
  try {
    if (S.audio) {
      const plan = type === 'ok' ? [[1320, 0.09]] : type === 'dup' ? [[660, 0.08], [660, 0.08]] : [[220, 0.32]];
      let t = S.audio.currentTime;
      for (const [f, d] of plan) {
        const o = S.audio.createOscillator(), g = S.audio.createGain();
        o.frequency.value = f; o.type = 'square'; g.gain.value = 0.15;
        o.connect(g); g.connect(S.audio.destination);
        o.start(t); o.stop(t + d); t += d + 0.05;
      }
    }
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate(type === 'ok' ? 60 : type === 'dup' ? [40, 40, 40] : 300); } catch (e) {}
}

let resultTimer = null;
function show(type, main, sub) {
  const box = $('result');
  box.className = 'result ' + type;
  box.querySelector('.main').textContent = main;
  $('resultSub').textContent = sub || '';
  $('frame').className = 'frame ' + type;
  beep(type);
  clearTimeout(resultTimer);
  resultTimer = setTimeout(() => {
    box.className = 'result';
    box.querySelector('.main').textContent = 'QR을 비춰 주세요';
    $('resultSub').textContent = '';
    $('frame').className = 'frame';
  }, type === 'bad' ? 2500 : 1300);
}

function updateCounts() {
  let n = 0;
  S.roster.forEach((p) => { if (p.att) n++; });
  $('cnt').textContent = n;
  $('tot').textContent = S.roster.size;
  const pe = $('pend');
  pe.textContent = '미전송 ' + S.queue.length + (S.inflight ? ' (전송 중)' : '');
  pe.classList.toggle('warn', S.queue.length > 0);
}

function persistQueue() { store.setJSON('scan_queue', S.queue); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function applyRoster(res) {
  S.round = String(res.round);
  S.secret = res.secret;
  S.valid = res.validSec; S.grace = res.graceSec; S.future = res.futureSec;
  S.roster.clear();
  res.roster.forEach(([o, name, birth, att, seat, status]) => S.roster.set(String(o), { name, birth, att, seat, status }));
  S.queue.forEach((q) => { const p = q.o && S.roster.get(q.o); if (p && !p.att && !q.undo) p.att = hhmmss(new Date(q.at)); });
  $('roundLbl').textContent = S.round + '차';
  $('info').innerHTML = '<b>' + esc(res.title || ('오프라인 ' + S.round + '차')) + '</b><br>명단 ' + S.roster.size + '명';
}

// ---------- 페이지를 열자마자 명단 미리 받기 ----------
async function preload() {
  if (!S.key) {
    $('info').textContent = '직원용 링크로 접속해 주세요.';
    $('startMsg').textContent = 'Apps Script의 직원링크_보기()에 나온 ① 스캐너 링크를 이 휴대폰에서 한 번 열면 이후 자동으로 연결됩니다.';
    return;
  }
  try {
    const res = await api('staffInit', { key: S.key }, 20000);
    if (!res.ok) { $('info').textContent = res.msg || '시작 정보를 받지 못했습니다.'; return; }
    applyRoster(res);
    store.setJSON('scan_cache', res);
    S.ready = true;
  } catch (e) {
    const c = store.getJSON('scan_cache');
    if (c) {
      applyRoster(c);
      S.ready = true;
      $('startMsg').textContent = '인터넷 연결이 불안정하여 이 기기에 저장된 명단으로 시작합니다. 기록은 연결되면 자동 전송됩니다.';
    } else {
      $('info').textContent = '서버에 연결하지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침해 주세요.';
      return;
    }
  }
  $('startBtn').disabled = false;
  updateCounts();
}

$('startBtn').addEventListener('click', async () => {
  if (!S.ready) return;
  try { S.audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  document.body.classList.add('scanning');
  try { if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); } catch (e) {}
  try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {}
  if (!S.scanner) {
    S.scanner = new QrScanner($('video'), (r) => onCode(r.data), {
      preferredCamera: 'environment',
      maxScansPerSecond: 25,
      returnDetailedScanResult: true,
      highlightScanRegion: false,
      highlightCodeOutline: false,
      calculateScanRegion: (v) => {
        const s = Math.round(Math.min(v.videoWidth, v.videoHeight) * 0.9);
        const d = Math.min(s, 520);
        return { x: Math.round((v.videoWidth - s) / 2), y: Math.round((v.videoHeight - s) / 2), width: s, height: s, downScaledWidth: d, downScaledHeight: d };
      }
    });
  }
  try {
    await S.scanner.start();
    if (await S.scanner.hasFlash()) $('torchBtn').hidden = false;
  } catch (e) {
    show('bad', '카메라를 열 수 없습니다', '브라우저 설정에서 카메라 권한을 허용해 주세요.');
  }
  updateCounts();
});

$('torchBtn').addEventListener('click', () => S.scanner && S.scanner.toggleFlash());

// ---------- QR 판정 (휴대폰 안에서 즉시 처리) ----------
async function onCode(raw) {
  if ($('manualPanel').classList.contains('show')) return;
  const text = String(raw || '').trim();
  const parts = text.split('.');
  if (parts.length !== 4) return showOnce('?' + text, 'bad', '출석 QR이 아닙니다', '알림톡으로 받은 출석 QR을 보여 주세요.');
  const [r, o, ts36, sig] = parts;
  const now = Date.now();
  const last = S.recent.get(o);
  if (last && now - last < 3000) return;  // 같은 사람 3초 내 재인식 무시
  S.recent.set(o, now);

  if (r !== S.round) return show('bad', '다른 회차 QR', r + '차 QR입니다. 오늘은 ' + S.round + '차입니다.');
  const k = (await hmac(S.secret, 'k:' + r + ':' + o)).slice(0, 16);
  const expect = (await hmac(k, r + '.' + o + '.' + ts36)).slice(0, 10);
  if (expect !== sig) return show('bad', '확인할 수 없는 QR', '위조되었거나 손상된 QR입니다.');

  const age = now / 1000 - parseInt(ts36, 36);
  const p = S.roster.get(o);
  const who = p ? p.name : '';
  if (age > S.valid + S.grace) return show('bad', '만료된 QR' + (who ? ' · ' + who : ''), '캡처 화면은 사용할 수 없습니다.\n알림톡 링크를 다시 열어 새 QR을 보여 주세요.');
  if (age < -S.future) return show('bad', '휴대폰 시각 오류' + (who ? ' · ' + who : ''), '휴대폰 시간을 자동 설정으로 바꾼 뒤 다시 열어 주세요.');

  if (p && p.att) return show('dup', who + ' · 이미 출석', p.att + ' 출석 처리됨');

  if (p) p.att = hhmmss(new Date(now));
  S.queue.push({ id: uid(), p: text, o, at: now });
  persistQueue();
  show('ok', who || '출석 확인', who ? '출석 완료 ' + hhmmss(new Date(now)) : '출석 완료 (이름은 새로고침 후 표시)');
  updateCounts();
  flush();
}

const onceMap = new Map();
function showOnce(key, type, main, sub) {
  const now = Date.now();
  if (onceMap.get(key) && now - onceMap.get(key) < 3000) return;
  onceMap.set(key, now);
  show(type, main, sub);
}

// ---------- 시트 기록 (뒤에서 일괄 전송, 실패 시 자동 재전송) ----------
const FAIL_TEXT = { EXPIRED: '만료된 QR', SIG: '서명 불일치', BAD: '형식 오류', WRONG_ROUND: '다른 회차', CLOCK: '시각 오류', NOT_FOUND: '명단에 없음' };

async function flush() {
  if (S.inflight || !S.queue.length) return;
  S.inflight = true; updateCounts();
  const head = S.queue[0];
  try {
    if (head.undo) {
      // 출석 취소는 한 건씩 처리
      const res = await api('attUndo', { key: S.key, o: head.o }, 20000);
      if (res.ok || res.code === 'NOT_FOUND') {
        S.queue.shift(); persistQueue();
        if (res.att) applyAtt(res.att, true);
      }
      return;
    }
    const batch = [];
    for (const q of S.queue) { if (q.undo) break; batch.push(q); if (batch.length >= 40) break; }
    const res = await api('checkin', {
      key: S.key, dev: S.dev,
      items: batch.map((x) => ({ id: x.id, p: x.p, o: x.o, manual: !!x.manual, at: x.at, dev: S.dev }))
    }, 25000);
    if (res.ok) {
      const ids = new Set(batch.map((b) => b.id));
      S.queue = S.queue.filter((q) => !ids.has(q.id));
      persistQueue();
      res.results.forEach((r) => {
        if (r.ok) {
          const p = S.roster.get(String(r.o));
          if (p) p.att = r.time; else S.roster.set(String(r.o), { name: r.name, att: r.time });
        } else {
          const src = batch.find((b) => b.id === r.id);
          const p = src && S.roster.get(src.o);
          if (p && !src.manual) p.att = '';
          addFail((p ? p.name : (src && src.o) || '') + ' · ' + (FAIL_TEXT[r.code] || r.code));
        }
      });
      applyAtt(res.att, false);
    } else if (res.code === 'KEY' || res.code === 'KEY_LOCK') {
      show('bad', '직원 링크 오류', res.msg);
    }
  } catch (e) {
    // 네트워크 오류: 대기열 유지 후 재시도
  } finally {
    S.inflight = false;
    updateCounts();
    if ($('manualPanel').classList.contains('show')) renderList();
  }
}
setInterval(flush, 1000);

// 서버 출석 현황 반영 (full=true면 서버에 없는 출석은 지움)
function applyAtt(att, full) {
  if (!att) return;
  const pendingO = new Set(S.queue.map((q) => q.o));
  S.roster.forEach((p, o) => {
    if (att[o]) p.att = att[o];
    else if (full && !pendingO.has(o)) p.att = '';
  });
  updateCounts();
}

// 다른 스캐너 기기에서 처리한 출석 반영 (15초 간격)
setInterval(async () => {
  if (!document.body.classList.contains('scanning') || S.inflight || S.queue.length) return;
  try { const res = await api('staffSync', { key: S.key }); if (res.ok && String(res.round) === S.round) applyAtt(res.att, true); } catch (e) {}
}, 15000);

function addFail(t) {
  S.fails.unshift(hhmmss() + ' ' + t);
  $('faillog').innerHTML = S.fails.slice(0, 30).map(esc).join('<br>');
}

// ---------- 2D 바코드 스캐너(키보드 입력 방식) ----------
let wedgeBuf = '', wedgeLast = 0;
document.addEventListener('keydown', (e) => {
  if (!document.body.classList.contains('scanning') || $('manualPanel').classList.contains('show')) return;
  const now = Date.now();
  if (now - wedgeLast > 300) wedgeBuf = '';
  wedgeLast = now;
  if (e.key === 'Enter') {
    const v = wedgeBuf; wedgeBuf = '';
    if (v.trim()) onCode(v);
    e.preventDefault();
  } else if (e.key && e.key.length === 1) {
    wedgeBuf += e.key;
  }
});

// ---------- 수동 출석 · 출석 취소 ----------
$('manualBtn').addEventListener('click', () => { $('manualPanel').classList.add('show'); $('search').value = ''; renderList(); });
$('closeManual').addEventListener('click', () => { $('manualPanel').classList.remove('show'); });
$('search').addEventListener('input', renderList);

function renderList() {
  const q = $('search').value.replace(/\s/g, '');
  const rows = [];
  S.roster.forEach((p, o) => { if (!q || (p.name || '').includes(q)) rows.push([o, p]); });
  rows.sort((a, b) => (a[1].name || '').localeCompare(b[1].name || '', 'ko'));
  $('list').innerHTML = rows.slice(0, 150).map(([o, p]) =>
    '<div class="person"><div><div class="nm">' + esc(p.name) + '</div>' +
    '<div class="st">' + esc(p.birth || '') + ' · ' + esc(p.status || '') + (p.att ? ' · <b style="color:var(--ok)">출석 ' + esc(p.att) + '</b>' : ' · 미출석') + '</div></div>' +
    (p.att
      ? '<button class="undo" data-act="undo" data-o="' + esc(o) + '">출석 취소</button>'
      : '<button class="do" data-act="do" data-o="' + esc(o) + '">출석 처리</button>') + '</div>'
  ).join('') || '<p class="muted">검색 결과가 없습니다.</p>';
  $('list').querySelectorAll('button[data-o]').forEach((b) => b.addEventListener('click', () => {
    if (b.dataset.act === 'undo') undoAtt(b.dataset.o); else manual(b.dataset.o);
  }));
}

function manual(o) {
  const p = S.roster.get(o);
  if (!p || p.att) return;
  if (!window.confirm(p.name + ' (' + (p.birth || '') + ') 님을 출석 처리할까요?')) return;
  const now = Date.now();
  p.att = hhmmss(new Date(now));
  S.queue.push({ id: uid(), o, manual: true, at: now });
  persistQueue();
  renderList(); updateCounts(); flush();
}

function undoAtt(o) {
  const p = S.roster.get(o);
  if (!p || !p.att) return;
  if (!window.confirm(p.name + ' (' + (p.birth || '') + ') 님의 출석(' + p.att + ')을 취소할까요?')) return;
  // 아직 전송 전인 출석 기록이면 대기열에서만 삭제
  const before = S.queue.length;
  if (!S.inflight) S.queue = S.queue.filter((q) => !(q.o === o && !q.undo));
  if (S.inflight || S.queue.length === before) S.queue.push({ id: uid(), o, undo: true, at: Date.now() });
  p.att = '';
  S.recent.delete(o);
  persistQueue();
  renderList(); updateCounts(); flush();
}

preload();
updateCounts();
</script>
</body>
</html>
