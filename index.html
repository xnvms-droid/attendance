<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>보수교육 출석·좌석</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .poster { text-align: center; }
  #seatQr { width: 220px; height: 220px; image-rendering: pixelated; }
  .url { word-break: break-all; font-size: 12px; }
  @media print {
    @page { size: A4 portrait; margin: 15mm; }
    body { background: #fff; }
    .no-print { display: none !important; }
    .card { border: 0; }
    .poster h2 { font-size: 30pt; margin: 20mm 0 6mm; }
    .poster p { font-size: 16pt; }
    #seatQr { width: 120mm; height: 120mm; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="no-print">
    <h1>보수교육 출석·좌석 (오프라인)</h1>
    <div class="card">
      <a class="btn" href="board.html">빔스크린 좌석 현황판 + 좌석등록 QR</a>
      <a class="btn secondary" href="seat.html">좌석 선택 (수강생 화면 미리보기)</a>
      <p class="muted">출석 스캐너와 현황판 수정 기능은 Apps Script의 <b>직원링크_보기()</b>에 나오는 직원용 링크로 접속합니다.</p>
      <p class="msg" id="ping">서버 확인 중…</p>
    </div>
  </div>

  <div class="card poster">
    <h2>좌석 등록 안내</h2>
    <p>자리에 앉으신 뒤 QR을 찍고<br><b>이름 · 생년월일 6자리</b>를 입력해 주세요.</p>
    <p class="muted no-print">빔스크린을 쓸 수 없을 때 책상에 비치하는 인쇄용 안내문입니다.</p>
    <canvas id="seatQr" width="400" height="400"></canvas>
    <p class="url muted" id="seatUrl"></p>
    <button class="btn secondary no-print" type="button" onclick="window.print()">이 안내문 인쇄 (교육장 게시용)</button>
  </div>
</div>

<script src="config.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="assets/common.js"></script>
<script>
(function () {
  var url = new URL('seat.html', location.href).href;
  document.getElementById('seatUrl').textContent = url;
  var qr = qrcode(0, 'M'); qr.addData(url); qr.make();
  var c = document.getElementById('seatQr'), ctx = c.getContext('2d');
  var n = qr.getModuleCount(), q = 4, cell = c.width / (n + q * 2);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.fillStyle = '#000';
  for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) if (qr.isDark(y, x)) ctx.fillRect(Math.floor((x + q) * cell), Math.floor((y + q) * cell), Math.ceil(cell), Math.ceil(cell));

  APP.api('ping', {}).then(function (r) {
    var el = document.getElementById('ping');
    el.className = 'msg ' + (r.ok ? 'ok' : 'bad');
    el.textContent = r.ok ? '서버 연결 정상 (' + r.time + ')' : '서버 오류: ' + r.msg;
  }).catch(function () {
    var el = document.getElementById('ping');
    el.className = 'msg bad'; el.textContent = '서버에 연결하지 못했습니다. config.js의 API_URL을 확인해 주세요.';
  });
})();
</script>
</body>
</html>
