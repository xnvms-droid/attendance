<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>보수교육 출석·좌석</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">
  <h1>보수교육 출석·좌석 (오프라인)</h1>
  <div class="card">
    <a class="btn" href="board.html">빔스크린 화면 (좌석 배치도 + 출석 QR)</a>
    <p class="muted">직원 현황판(실명·좌석 수정·교시 전환·현장 대리입력)과 서명부 인쇄는 Apps Script의 <b>직원링크_보기()</b>에 나오는 직원용 링크로 접속합니다.</p>
    <p class="msg" id="ping">서버 확인 중…</p>
  </div>
</div>
<script src="config.js"></script>
<script src="assets/common.js"></script>
<script>
APP.api('ping', {}).then(function (r) {
  var el = document.getElementById('ping');
  el.className = 'msg ' + (r.ok ? 'ok' : 'bad');
  el.textContent = r.ok ? '서버 연결 정상 (' + r.time + ')' : '서버 오류: ' + r.msg;
}).catch(function () {
  var el = document.getElementById('ping');
  el.className = 'msg bad'; el.textContent = '서버에 연결하지 못했습니다. config.js의 API_URL을 확인해 주세요.';
});
</script>
</body>
</html>
