<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>좌석 현황판</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  html, body { height: 100%; }
  body { background: #f4f5f7; color: #1d2129; }
  :root { --seat-w: minmax(30px, 1fr); --aisle: 1.6vw; --door-w: 2vw; --rowlab-w: 2.6vw; --seat-taken: #c9ced6; --seat-free: #ffffff; --line: #d9dce1; --muted: #6b7280; --text: #1d2129; --bg: #f4f5f7; --card: #fff; }

  /* ---------- 빔스크린: 왼쪽 배치도 · 오른쪽 출석 QR ---------- */
  .beam { display: grid; grid-template-columns: 1fr minmax(300px, 27vw); gap: 1.6vw; height: 100vh; padding: 1.6vh 1.6vw; }
  .beam-map { background: #fff; border-radius: 16px; padding: 1.6vh 1.4vw; display: flex; flex-direction: column; min-height: 0; }
  .beam-head { display: flex; align-items: baseline; gap: 1.2vw; margin-bottom: 1vh; flex-wrap: wrap; }
  .beam-head h1 { margin: 0; font-size: clamp(20px, 3.2vh, 40px); }
  .beam-head .stat { font-size: clamp(14px, 2.2vh, 26px); color: #444; }
  .beam-head .stat b { font-size: clamp(18px, 3vh, 34px); color: #138a4a; }
  .map-holder { flex: 1; min-height: 0; }
  .room { min-width: 0; }
  .room-front { font-size: clamp(11px, 1.7vh, 20px); margin-bottom: 1.2vh; }
  .seat-grid { gap: .45vh .3vw; grid-auto-rows: calc((100vh - 3.2vh - 3.2vh - 7vh - 4.5vh - 6vh - 3.2vh) / 9); }
  .back-row { gap: .3vw; }
  .seat { border-radius: 8px; gap: .2vh; }
  .seat .no { font-size: clamp(11px, 2vh, 24px); color: #8a919c; font-weight: 700; }
  .seat .nm { font-size: clamp(11px, 2.1vh, 24px); }
  /* 9열(3석)은 칸이 좁아 이름 글씨를 줄여 잘리지 않게 */
  .back-row .seat { padding-left: 0; padding-right: 0; }
  .back-row .seat .nm { font-size: clamp(9px, 1.55vh, 17px); letter-spacing: -1.5px; text-overflow: clip; overflow: visible; }
  .back-row .seat .st { font-size: clamp(8px, 1.15vh, 13px); letter-spacing: -1px; white-space: nowrap; }
  .seat .st { font-size: clamp(9px, 1.4vh, 16px); font-weight: 800; }
  .seat .bd { font-size: clamp(8px, 1.3vh, 14px); color: var(--muted); }
  .seat.filled .no { display: none; }   /* 좌석이 채워지면 번호 대신 이름·출석완료 표시 */
  .seat.filled.ok { background: #dff3e6; border-color: #138a4a; }
  .seat.filled.ok .st { color: #138a4a; }
  .seat.filled.wait { background: #eef0f3; border-color: #9aa1ad; }
  .seat.filled.wait .st { color: #8a919c; }
  .seat.moving { outline: 4px solid #c27c0e; outline-offset: 1px; }
  .door { font-size: clamp(11px, 1.8vh, 20px); }
  .rowlab { font-size: clamp(11px, 1.9vh, 22px); }
  .colhead { font-size: clamp(10px, 1.6vh, 19px); padding: .2vh 0; }
  .staff-desk { margin-top: 1.2vh; font-size: clamp(11px, 1.6vh, 18px); padding: .5vh 0; }

  .beam-side { background: #1f5fbf; color: #fff; border-radius: 16px; padding: 2vh 1.6vw; display: flex; flex-direction: column; align-items: center; text-align: center; min-height: 0; }
  .beam-side .ttl { font-size: clamp(20px, 3.6vh, 46px); font-weight: 900; letter-spacing: 1px; line-height: 1.15; }
  .beam-side .sess { margin-top: .6vh; background: #fff; color: #1f5fbf; border-radius: 999px; padding: .3vh 1.2vw; font-size: clamp(14px, 2.3vh, 28px); font-weight: 900; }
  .beam-side .qrwrap { position: relative; background: #fff; border-radius: 16px; padding: 1.1vh; margin: 1.2vh 0 .6vh; width: min(100%, 34vh); }
  .beam-side canvas#beamQr { width: 100%; aspect-ratio: 1; display: block; image-rendering: pixelated; }
  .qr-msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; color: #1d2129; font-weight: 800; font-size: clamp(13px, 2vh, 22px); padding: 1vh; background: #fff; border-radius: 16px; }
  .qr-msg.show { display: flex; }
  .rot { width: min(100%, 34vh); height: .7vh; min-height: 4px; background: rgba(255,255,255,.25); border-radius: 4px; overflow: hidden; }
  .rot i { display: block; height: 100%; background: #ffd166; width: 100%; transition: width .9s linear; }
  .rot-tx { font-size: clamp(10px, 1.3vh, 15px); opacity: .85; margin-top: .3vh; }
  .beam-side ol { text-align: left; margin: 1.2vh 0 0; padding-left: 1.3em; font-size: clamp(15px, 2.65vh, 34px); line-height: 1.3; font-weight: 900; letter-spacing: -.3px; white-space: nowrap; }
  .beam-side ol .red { color: #ffb3b3; }
  .beam-side ol small { display: block; white-space: normal; font-weight: 600; font-size: .55em; opacity: .9; line-height: 1.3; }
  .beam-warn { margin-top: 1vh; width: 100%; background: #d10000; color: #fff; border-radius: 10px; padding: .6vh .6vw; font-size: clamp(12px, 1.9vh, 23px); font-weight: 900; line-height: 1.35; }
  .beam-warn small { display: block; font-weight: 700; font-size: .8em; }
  .wifi { margin-top: 1vh; width: 100%; background: #fff; color: #1d2129; border-radius: 12px; padding: .8vh .8vw; }
  .wifi-ttl { font-size: clamp(14px, 2.2vh, 26px); font-weight: 900; margin-bottom: .5vh; color: #d10000; }
  .wifi-ttl small { font-weight: 700; font-size: .7em; margin-left: .4em; color: #d10000; }
  .wifi-list { display: flex; gap: .8vw; justify-content: center; }
  .wifi-item { display: flex; flex-direction: column; gap: .3vh; align-items: center; text-align: center; min-width: 0; flex: 1; }
  .wifi-item canvas { width: clamp(40px, 6vh, 80px); height: clamp(40px, 6vh, 80px); background: #fff; border: 1px solid #c9ced6; border-radius: 6px; padding: 3px; flex: none; }
  .wifi-item .tx { font-size: clamp(10px, 1.2vh, 14px); line-height: 1.3; white-space: nowrap; }
  .wifi-item .tx b { font-size: 1.1em; color: #1d2129; }
  .beam-side .foot { margin-top: auto; padding-top: .6vh; font-size: clamp(9px, 1.1vh, 13px); opacity: .65; font-variant-numeric: tabular-nums; }

  /* ---------- 직원 도구 (전체화면에서는 숨김, 마우스를 올리면 표시) ---------- */
  .tools { position: fixed; left: 2.4vw; bottom: 2.2vh; display: flex; gap: 6px; z-index: 30; flex-wrap: wrap; max-width: 66vw; }
  .tools button, .tools a { border: 0; border-radius: 10px; padding: 9px 12px; font-size: 13px; font-weight: 700; background: #1d2129; color: #fff; cursor: pointer; text-decoration: none; }
  .tools .light { background: #fff; color: #1d2129; border: 1px solid #c9ced6; }
  .tools .on { background: #c27c0e; color: #fff; border-color: #c27c0e; }
  .tools .mode { background: #c27c0e; color: #fff; border-radius: 10px; padding: 9px 12px; font-size: 13px; font-weight: 700; }
  body.fs .tools { opacity: 0; transition: opacity .3s; }
  body.fs .tools:hover { opacity: 1; }
  .move-banner { position: fixed; left: 50%; top: 1.2vh; transform: translateX(-50%); background: #c27c0e; color: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 800; z-index: 31; display: none; }
  .move-banner.show { display: block; }
  .move-banner button { margin-left: 10px; border: 0; border-radius: 8px; padding: 6px 10px; font-weight: 700; }
  .person { display: flex; justify-content: space-between; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--line); gap: 8px; }
  .person button { padding: 8px 12px; border: 0; border-radius: 8px; background: #1f5fbf; color: #fff; font-weight: 700; white-space: nowrap; }
  #pickList { max-height: 46vh; overflow: auto; }
  .seat.devwarn { box-shadow: inset 0 0 0 3px #e67e00; }
  .seat.devsoft { box-shadow: inset 0 0 0 3px #9aa2ae; }
  .seat .st.st-soft { color: #6b7280 !important; font-weight: 800; white-space: nowrap; }
  .devtag.soft { background: #f1f3f6; color: #4b5563; border-color: #9aa2ae; }
  .seat.devwarn::after { content: '⚠'; position: absolute; top: 1px; right: 3px; font-size: 1.1em; color: #e67e00; }
  .seat .st.st-dev { color: #c25e00 !important; font-weight: 900; }
  .devtag { display: inline-block; background: #fff3e0; color: #b85c00; border: 1px solid #e67e00; border-radius: 6px; padding: 1px 6px; font-size: 12px; font-weight: 800; margin-left: 4px; }
  .tel { color: #1f5fbf; font-weight: 700; text-decoration: none; white-space: nowrap; }
  .tel:hover { text-decoration: underline; }
  .pfilter { display: flex; gap: 6px; margin: 8px 0 2px; flex-wrap: wrap; }
  .pfilter button { border: 1px solid #c9ced6; background: #fff; color: #1d2129; border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .pfilter button.on { background: #1d2129; color: #fff; border-color: #1d2129; }

  /* ---------- 직원 화면: 확인 목록(서명 전 · 좌석 미지정 · 자리 비움) ---------- */
  .chk { display: none; background: #fff; border-radius: 16px; border: 2px solid #1d2129; padding: 1.4vh 1vw; flex-direction: column; min-height: 0; }
  body.staff-chk .beam-side { display: none; }
  body.staff-chk .chk { display: flex; }
  .chk-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .chk-head b { font-size: 18px; }
  .chk-head span { font-size: 12px; color: var(--muted); }
  .chk-tabs { display: flex; gap: 4px; margin: 8px 0 4px; }
  .chk-tabs button { flex: 1; border: 1px solid #c9ced6; background: #fff; color: #1d2129; border-radius: 8px; padding: 7px 4px; font-size: 13px; font-weight: 800; cursor: pointer; white-space: nowrap; }
  .chk-tabs button.on { background: #1d2129; color: #fff; border-color: #1d2129; }
  .chk-tabs button i { font-style: normal; display: inline-block; min-width: 1.6em; margin-left: 3px; border-radius: 999px; background: #e9ecf1; color: #1d2129; font-size: 12px; padding: 0 5px; }
  .chk-tabs button.on i { background: #fff; }
  .chk-tabs button i.hot { background: #d10000; color: #fff; }
  .chk-note { font-size: 12px; color: var(--muted); margin: 2px 0 4px; line-height: 1.4; }
  .chk-list { flex: 1; overflow: auto; min-height: 0; }
  .chk-item { display: flex; align-items: center; gap: 8px; padding: 8px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .chk-item:hover { background: #f4f6fa; }
  .chk-item .who { flex: 1; min-width: 0; }
  .chk-item .who b { font-size: 15px; }
  .chk-item .who .sub { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chk-item .call { flex: none; border: 1px solid #1f5fbf; color: #1f5fbf; border-radius: 8px; padding: 5px 8px; font-size: 13px; font-weight: 800; text-decoration: none; }
  .chk-item .tdur { flex: none; font-weight: 900; font-variant-numeric: tabular-nums; color: #b25e00; }
  .chk-item .tdur.over, .tdur.over { color: #d10000; }
  .chk-item.done { cursor: default; }
  .chk-tools { display: flex; gap: 6px; margin-top: 6px; }
  .chk-tools[hidden] { display: none; }
  .chk-tools button { flex: 1; border: 1px solid #c9ced6; background: #fff; border-radius: 8px; padding: 7px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .seat.away { background: #fff4d6 !important; border-color: #c27c0e !important; }
  .seat.away .st { color: #b25e00 !important; font-weight: 900; font-variant-numeric: tabular-nums; }
  .seat.away.over { background: #ffe1e1 !important; border-color: #d10000 !important; }
  .seat.away.over .st { color: #d10000 !important; }
  .tbox { border: 1px solid #e3c27a; background: #fffaf0; border-radius: 10px; padding: 10px; margin: 8px 0; }
  .tbox .tnow { font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; color: #b25e00; }
  .tbox .tnow.over { color: #d10000; }
  .tbox .tbtns { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .tbox .tbtns button { flex: 1; border: 0; border-radius: 8px; padding: 10px; font-weight: 800; cursor: pointer; }
  .tbox .t-start { background: #c27c0e; color: #fff; }
  .tbox .t-back { background: #138a4a; color: #fff; }
  .tbox .t-undo { background: #e9ecf1; color: #1d2129; flex: 0 0 auto !important; }
  .tbox .thist { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.5; }

  @media (max-width: 900px), (max-aspect-ratio: 1/1) {
    .beam { grid-template-columns: 1fr; height: auto; }
    body.staff-chk .chk { order: -1; max-height: 60vh; }
    .seat-grid { grid-auto-rows: 54px; }
    .beam-side .qrwrap, .rot { width: min(80%, 320px); }
  }
</style>
</head>
<body>
<div class="beam">
  <main class="beam-map">
    <div class="beam-head">
      <h1 id="title">좌석 현황</h1>
      <span class="stat" id="statBox" hidden><span id="sLbl">출석</span> <b id="sSigned">0</b>/<span id="sTotal">0</span></span>
    </div>
    <div class="map-holder" id="map"></div>
  </main>

  <aside class="beam-side">
    <div class="ttl">출석 QR</div>
    <div class="sess" id="sessLbl">-</div>
    <div class="qrwrap"><canvas id="beamQr" width="560" height="560" aria-label="출석 QR"></canvas><div class="qr-msg" id="qrMsg">불러오는 중…</div></div>
    <div class="rot"><i id="rotBar"></i></div>
    <div class="rot-tx">QR은 <span id="rotSec">30</span>초마다 바뀝니다 · 교육장 안에서 바로 촬영해 주세요</div>
    <ol>
      <li>휴대폰 카메라로 QR 촬영</li>
      <li>이름·생년월일·휴대폰번호 입력</li>
      <li><span class="red">서명</span> (이름을 정자로)</li>
      <li>앉은 좌석 누르기<small>잘못 누른 경우 다른 좌석을 누르면 변경됩니다</small></li>
    </ol>
    <div class="beam-warn">⚠ 반드시 본인만 출석해 주세요<small>휴대폰 1대로 1명만 출석·좌석 지정할 수 있습니다</small></div>
    <div class="wifi" id="wifi" hidden>
      <div class="wifi-ttl">교육장 Wi-Fi <small>카메라로 찍으면 바로 연결</small></div>
      <div class="wifi-list" id="wifiList"></div>
    </div>
    <div class="foot"><span id="clock">--:--:--</span> · 자동 갱신 <span id="sUpd">-</span></div>
  </aside>

  <!-- 직원 화면 전용: 확인 목록 (직원 링크로 열었을 때만 표시) -->
  <aside class="chk" id="chk" aria-label="확인 목록">
    <div class="chk-head"><b>확인 목록</b><span id="chkSess">-</span></div>
    <div class="chk-tabs">
      <button type="button" data-t="sign">서명 전<i id="cSign">0</i></button>
      <button type="button" data-t="seat">좌석 미지정<i id="cSeat">0</i></button>
      <button type="button" data-t="away">자리 비움<i id="cAway">0</i></button>
    </div>
    <div class="chk-note" id="chkNote"></div>
    <div class="chk-list" id="chkList"></div>
    <div class="chk-tools" id="chkTools" hidden><button type="button" id="awayCopy">기록 복사(엑셀 붙여넣기)</button></div>
  </aside>
</div>

<div class="tools" id="tools">
  <span class="mode" id="modeLbl" hidden>직원 모드</span>
  <span id="sessBtns" hidden></span>
  <button class="light" id="nameBtn" type="button" hidden>실명 보기</button>
  <button class="light" id="listBtn" type="button" hidden>명단·연락처</button>
  <button class="light" id="chkBtn" type="button" hidden>확인 목록</button>
  <a class="light" id="proxyBtn" href="#" target="_blank" rel="noopener" hidden>현장 대리입력</a>
  <a class="light" id="signBtn" href="#" target="_blank" rel="noopener" hidden>서명부 인쇄</a>
  <button id="fsBtn" type="button">전체화면</button>
</div>
<div class="move-banner" id="moveBanner"><span id="moveText"></span><button type="button" id="moveCancel">이동 취소</button></div>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet">
    <div class="muted" id="sheetSub"></div>
    <div class="big" id="sheetTitle"></div>
    <div id="sheetBody"></div>
    <button class="btn secondary" id="closeSheet" type="button">닫기</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="assets/common.js"></script>
<script>
(function () {
  'use strict';
  var api = APP.api, esc = APP.esc, $ = function (id) { return document.getElementById(id); };
  var key = APP.staffKey();              // 직원용 링크(?k=)로 연 경우에만 직원 기능
  var admin = !!key;
  var showReal = false;                  // 빔에 실명 노출 방지: 기본은 한○목 형태
  var data = { seats: {} };
  var sheetSeat = null, moving = null, lastToken = '', nextAt = 0;
  var base = new URL('./', location.href).href;

  function toast(t) {
    var el = $('toast'); el.textContent = t; el.classList.add('show');
    clearTimeout(toast.tm); toast.tm = setTimeout(function () { el.classList.remove('show'); }, 2600);
  }

  function drawQr(canvas, text, margin) {
    var qr = qrcode(0, 'M'); qr.addData(text); qr.make();
    var ctx = canvas.getContext('2d'), n = qr.getModuleCount(), q = margin, cell = canvas.width / (n + q * 2);
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = '#000';
    for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) {
      if (qr.isDark(y, x)) ctx.fillRect(Math.floor((x + q) * cell), Math.floor((y + q) * cell), Math.ceil(cell), Math.ceil(cell));
    }
  }

  // ---------- 교육장 Wi-Fi QR (config.js의 WIFI) ----------
  (function () {
    var list = (APP.CFG.WIFI || []).filter(function (w) { return w && w.ssid; });
    if (!list.length) return;
    function wq(s) { return String(s).replace(/([\\;,:"])/g, '\\$1'); }
    list.slice(0, 2).forEach(function (w) {
      var item = document.createElement('div'); item.className = 'wifi-item';
      var c = document.createElement('canvas'); c.width = 220; c.height = 220;
      drawQr(c, 'WIFI:T:' + (w.pw ? 'WPA' : 'nopass') + ';S:' + wq(w.ssid) + ';' + (w.pw ? 'P:' + wq(w.pw) + ';' : '') + ';', 2);
      var tx = document.createElement('div'); tx.className = 'tx';
      tx.innerHTML = 'ID <b>' + esc(w.ssid) + '</b><br>PW <b>' + esc(w.pw || '없음') + '</b>';
      item.appendChild(c); item.appendChild(tx); $('wifiList').appendChild(item);
    });
    $('wifi').hidden = false;
  })();

  // ---------- 배치도 ----------
  APP.renderSeatMap($('map'), { onSeat: onSeat });
  $('map').querySelectorAll('.seat').forEach(function (b) {
    var st = document.createElement('span'); st.className = 'st'; b.appendChild(st);
    var bd = document.createElement('span'); bd.className = 'bd'; b.appendChild(bd);
  });

  function mask(name) {
    var s = String(name || '');
    if (s.length <= 1) return s;
    if (s.length === 2) return s.charAt(0) + '○';
    return s.charAt(0) + new Array(s.length - 1).join('○') + s.charAt(s.length - 1);
  }

  // 연락처 표시 (직원 모드 전용) : 01045406906 → 010-4540-6906, 누르면 전화 걸기
  function fmtPhone(d) {
    d = String(d || '').replace(/\D/g, '');
    if (d.length === 11) return d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7);
    if (d.length === 10) return d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6);
    return d;
  }
  function telHtml(p) {
    return p.phone ? '<a class="tel" href="tel:' + esc(p.phone) + '">☎ ' + esc(fmtPhone(p.phone)) + '</a>' : '<span class="muted">연락처 없음</span>';
  }
  function matchQ(p, q) {
    if (!q) return true;
    var dq = q.replace(/\D/g, '');
    return p.name.indexOf(q) >= 0 || (dq.length >= 3 && String(p.phone || '').indexOf(dq) >= 0);
  }

  // 빔 제목: 부산 오프라인57차 사회복지사 보수교육 2026. 11. 12.(목)
  function beamTitle(round, eduDate) {
    var t = '부산 오프라인' + round + '차 사회복지사 보수교육';
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(eduDate || '');
    if (m) {
      var dt = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
      t += ' ' + m[1] + '. ' + Number(m[2]) + '. ' + Number(m[3]) + '.(' + '일월화수목금토'.charAt(dt.getDay()) + ')';
    }
    return t;
  }

  // 기기확인 기록 → hard(다른 휴대폰) / soft(같은 휴대폰 추정, 브라우저만 다름) / ''
  function devLevel(f) {
    f = String(f || '');
    if (!f) return '';
    return f.indexOf('기기 다름') >= 0 ? 'hard' : 'soft';
  }
  function devTagHtml(f) {
    var lv = devLevel(f);
    if (!lv) return '';
    return '<span class="devtag' + (lv === 'soft' ? ' soft' : '') + '">' + (lv === 'soft' ? 'ⓘ ' : '⚠ ') + esc(f) + '</span>';
  }

  function personBySeat(id) {
    return (data.people || []).filter(function (p) { return p.seat === id; })[0];
  }

  function paintSeat(id, b) {
      var v = data.seats[id];
      var p = admin ? personBySeat(id) : null;
      var aw = admin && p && v ? awayRunning(p.o) : null;
      var el = aw ? Date.now() - aw.start : 0;
      b.classList.toggle('away', !!aw);
      b.classList.toggle('over', !!aw && el >= AWAY_LIMIT);
      b.classList.toggle('filled', !!v);
      b.classList.toggle('ok', !!v && v.ok);
      b.classList.toggle('wait', !!v && !v.ok);
      b.classList.toggle('moving', !!moving && moving.from === id);
      var lv = admin && p ? devLevel(p.devFlag) : '';   // 직원 화면에만 표시: hard = 다른 휴대폰, soft = 같은 휴대폰·브라우저만 다름
      b.classList.toggle('devwarn', lv === 'hard');
      b.classList.toggle('devsoft', lv === 'soft');
      b.querySelector('.nm').textContent = !v ? '' : (showReal && p ? p.name : v.n);
      b.querySelector('.st').textContent = !v ? '' : aw ? '⏱ ' + fmtDur(el) : lv === 'hard' ? '⚠ 기기 다름' : lv === 'soft' ? 'ⓘ 브라우저' : (v.ok ? '출석완료' : '서명 전');
      b.querySelector('.st').classList.toggle('st-dev', lv === 'hard');
      b.querySelector('.st').classList.toggle('st-soft', lv === 'soft');
      b.querySelector('.bd').textContent = showReal && p ? p.birth : '';
  }

  function paint() {
    APP.updateSeats($('map'), paintSeat);
    var c = data.counts || {};
    $('sTotal').textContent = c.total || 0;
    $('sSigned').textContent = c.signed || 0;
    $('sLbl').textContent = (data.sessionLabel || '') + ' 출석';
    $('sUpd').textContent = data.t || '-';
    $('title').textContent = data.round ? beamTitle(data.round, data.eduDate) : '좌석 현황';
    $('statBox').hidden = !admin;   // 출석 인원은 직원 화면에만 표시
    $('sessLbl').textContent = data.sessionLabel ? data.sessionLabel + ' 출석' : '-';

    var msg = '';
    if (data.noRound) msg = data.msg || '진행 중인 회차가 없습니다.';
    else if (data.round && !data.eduOk) msg = '교육 당일에 출석 QR이 표시됩니다.';
    $('qrMsg').textContent = msg;
    $('qrMsg').classList.toggle('show', !!msg || !lastToken);

    $('modeLbl').hidden = !admin; $('nameBtn').hidden = !admin; $('sessBtns').hidden = !admin;
    $('proxyBtn').hidden = !admin; $('listBtn').hidden = !admin; $('signBtn').hidden = !admin;
    $('chkBtn').hidden = !admin;
    $('chkBtn').classList.toggle('on', admin && chkOn);
    document.body.classList.toggle('staff-chk', admin && chkOn);
    if (admin) { awayLoad(); renderChk(); }
    $('nameBtn').textContent = showReal ? '이름 가리기' : '실명 보기';
    if (admin) renderSessBtns();
  }

  function renderSessBtns() {
    var box = $('sessBtns');
    var list = [{ no: 0, label: '교시 자동' }].concat((data.sessions || []).map(function (s) { return { no: s.no, label: s.no + '교시' }; }));
    box.innerHTML = list.map(function (s) {
      var on = (data.override || 0) === s.no;
      return '<button type="button" class="light' + (on ? ' on' : '') + '" data-sess="' + s.no + '">' + esc(s.label) + '</button> ';
    }).join('');
    box.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', async function () {
        try {
          var r = await api('adminSession', { key: key, session: Number(b.dataset.sess) });
          toast(r.ok ? '현재 ' + r.sessionLabel + '로 표시합니다.' : r.msg);
        } catch (e) { toast('연결 오류'); }
        refresh();
      });
    });
  }

  function updateQr() {
    if (data.token && data.token !== lastToken) {
      lastToken = data.token;
      drawQr($('beamQr'), base + 'c.html?t=' + encodeURIComponent(data.token), 3);
    }
    if (!data.token) lastToken = '';
    if (data.rotateSec) {
      $('rotSec').textContent = data.rotateSec;
      nextAt = Date.now() + (data.nextIn || data.rotateSec) * 1000;
    }
  }

  async function refresh() {
    try {
      var res = await api('beamState', admin ? { key: key } : {});
      if (!res.ok) {
        if (admin && (res.code === 'KEY' || res.code === 'KEY_LOCK')) { admin = false; toast(res.msg); }
        return;
      }
      data = res;
      updateQr();
      paint();
    } catch (e) {}
  }

  function loop() {
    setTimeout(function () { refresh().finally(loop); }, 3000);
  }
  setInterval(function () {
    $('clock').textContent = APP.hhmmss();
    if (nextAt && data.rotateSec) {
      var left = Math.max(0, (nextAt - Date.now()) / 1000);
      $('rotBar').style.width = (left / data.rotateSec * 100).toFixed(1) + '%';
      if (left <= 0) { nextAt = 0; refresh(); }
    }
  }, 500);

  // ---------- 전체화면 ----------
  $('fsBtn').addEventListener('click', function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    else toast('이 브라우저는 전체화면을 지원하지 않습니다. F11 키를 눌러 주세요.');
  });
  document.addEventListener('fullscreenchange', function () {
    var fs = !!document.fullscreenElement;
    document.body.classList.toggle('fs', fs);
    $('fsBtn').textContent = fs ? '전체화면 종료' : '전체화면';
  });

  if (admin) {
    $('proxyBtn').href = 'c.html?k=' + encodeURIComponent(key);
    $('signBtn').href = 'sign.html?k=' + encodeURIComponent(key);
  }
  $('nameBtn').addEventListener('click', function () { showReal = !showReal; paint(); });

  // ---------- 직원 모드: 좌석 해제 · 이동 · 배정 ----------
  function sessText(p) {
    return [1, 2, 3].map(function (k) { return k + '교시 ' + (p['s' + k] || '-'); }).join(' · ');
  }

  function onSeat(id) {
    if (!admin) return;
    var p = personBySeat(id);
    if (moving) {
      if (p) { toast('빈 좌석을 눌러 주세요.'); return; }
      var m = moving; moving = null; $('moveBanner').classList.remove('show');
      seatOp({ op: 'assign', seat: id, o: m.o }, m.name + ' → ' + APP.seatLabel(id) + ' 이동했습니다.');
      return;
    }
    if (p) { openPerson(p); return; }
    sheetSeat = id;
    $('sheetSub').textContent = APP.seatLabel(id);
    $('sheetTitle').textContent = '빈 좌석 · 직접 배정';
    $('sheetBody').innerHTML = '<input id="q" type="search" placeholder="이름 또는 연락처 검색"><div id="pickList"></div>';
    $('q').addEventListener('input', renderPick);
    renderPick();
    $('sheetBg').classList.add('show');
  }

  // 수강생 상세 (좌석을 누르거나 확인 목록에서 이름을 누르면 표시)
  function openPerson(p) {
    var id = p.seat || null;
    sheetSeat = id;
    personOpen = p.o;
    $('sheetSub').textContent = id ? APP.seatLabel(id) : '좌석 미지정';
    $('sheetTitle').textContent = p.name + ' (' + p.birth + ')';
    $('sheetBody').innerHTML = '<p>' + telHtml(p) + (p.org ? ' <span class="muted">· ' + esc(p.org) + '</span>' : '') + '</p>' +
      (p.devFlag ? '<p>' + devTagHtml(p.devFlag) + ' <span class="muted">' + (devLevel(p.devFlag) === 'hard' ? '처음 출석한 휴대폰과 다른 휴대폰으로 출석했습니다. 본인 여부를 확인해 주세요.' : '같은 휴대폰에서 다른 인터넷 앱(브라우저)으로 출석한 것으로 보입니다. 참고용입니다.') + '</span></p>' : '') +
      '<p class="muted">' + esc(sessText(p)) + '</p>' +
      '<div class="tbox" id="tbox"></div>' +
      (id ? '<div class="row2"><button class="btn secondary" id="moveBtn" type="button">다른 좌석으로 이동</button>' +
        '<button class="btn" id="clearBtn" type="button" style="background:var(--bad)">좌석 해제</button></div>'
        : '<p class="muted">좌석이 지정되지 않았습니다. 배치도에서 빈 좌석을 눌러 직접 배정할 수 있습니다.</p>');
    renderTimerBox(p);
    if (id) {
      $('moveBtn').addEventListener('click', function () {
        moving = { o: p.o, name: p.name, from: id };
        $('moveText').textContent = p.name + ' 님을 옮길 빈 좌석을 누르세요';
        $('moveBanner').classList.add('show');
        closeSheet();
        paint();
      });
      $('clearBtn').addEventListener('click', function () {
        if (window.confirm(p.name + ' 님의 ' + APP.seatLabel(id) + ' 좌석을 해제할까요?')) seatOp({ op: 'clear', seat: id }, '좌석을 해제했습니다.');
      });
    }
    $('sheetBg').classList.add('show');
  }

  // ---------- 직원 화면: 자리 비움 타이머 (15분 내 복귀 확인용) ----------
  // 기록은 이 직원 기기의 브라우저에 회차별로 저장됩니다(다른 직원 기기와 공유되지 않음).
  var AWAY_LIMIT_MIN = 15, AWAY_LIMIT = AWAY_LIMIT_MIN * 60 * 1000;
  var awayList = [], awayRound = null, personOpen = null;
  function awayKey() { return 'away_' + (data.round || 'none'); }
  function awayLoad() {
    var r = data.round || 'none';
    if (awayRound === r) return;
    awayRound = r;
    try { awayList = JSON.parse(localStorage.getItem(awayKey()) || '[]') || []; } catch (e) { awayList = []; }
  }
  function awaySave() { try { localStorage.setItem(awayKey(), JSON.stringify(awayList)); } catch (e) {} }
  function awayRunning(o) { return awayList.filter(function (a) { return a.o === o && !a.end; })[0] || null; }
  function awayOf(o) { return awayList.filter(function (a) { return a.o === o; }); }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function fmtDur(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    return pad2(Math.floor(s / 60)) + ':' + pad2(s % 60);
  }
  function fmtDurKo(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    return Math.floor(s / 60) + '분 ' + pad2(s % 60) + '초';
  }
  function hm(t) { var d = new Date(t); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
  function awayStart(p) {
    if (awayRunning(p.o)) return;
    awayList.push({ id: Date.now() + '_' + p.o, o: p.o, name: p.name, birth: p.birth, seat: p.seat || '', sess: data.session || 0, start: Date.now(), end: 0, alerted: false });
    awaySave(); toast(p.name + ' 님 자리 비움 시간 측정을 시작했습니다.');
  }
  function awayBack(o) {
    var a = awayRunning(o); if (!a) return;
    a.end = Date.now(); awaySave();
    var d = a.end - a.start;
    toast(a.name + ' 님 복귀 · ' + fmtDurKo(d) + (d > AWAY_LIMIT ? ' (' + AWAY_LIMIT_MIN + '분 초과)' : ''));
  }
  function awayUndo(id) {
    awayList = awayList.filter(function (a) { return a.id !== id; }); awaySave();
  }
  function renderTimerBox(p) {
    var box = $('tbox'); if (!box) return;
    var a = awayRunning(p.o), hist = awayOf(p.o).filter(function (x) { return x.end; });
    var h = '';
    if (a) {
      var el = Date.now() - a.start;
      h += '<div class="muted">자리 비움 · ' + hm(a.start) + ' 나감 · 기준 ' + AWAY_LIMIT_MIN + '분</div>' +
        '<div class="tnow tdur' + (el >= AWAY_LIMIT ? ' over' : '') + '" data-s="' + a.start + '" data-long="1">' + fmtDur(el) + (el >= AWAY_LIMIT ? ' 초과' : '') + '</div>' +
        '<div class="tbtns"><button type="button" class="t-back" id="tBack">복귀 확인</button><button type="button" class="t-undo" id="tUndo">잘못 누름(삭제)</button></div>';
    } else {
      h += '<div class="muted">교육 중 자리를 비운 경우 눌러 주세요. ' + AWAY_LIMIT_MIN + '분이 지나면 빨간색으로 표시됩니다.</div>' +
        '<div class="tbtns"><button type="button" class="t-start" id="tStart">⏱ 자리 비움 시작</button></div>';
    }
    if (hist.length) {
      h += '<div class="thist">' + hist.map(function (x) {
        var d = x.end - x.start;
        return (x.sess ? x.sess + '교시 ' : '') + hm(x.start) + ' 나감 → ' + hm(x.end) + ' 복귀 · ' + fmtDurKo(d) + (d > AWAY_LIMIT ? ' <b style="color:#d10000">초과</b>' : '');
      }).join('<br>') + '</div>';
    }
    box.innerHTML = h;
    if ($('tStart')) $('tStart').addEventListener('click', function () { awayStart(p); afterAway(p); });
    if ($('tBack')) $('tBack').addEventListener('click', function () { awayBack(p.o); afterAway(p); });
    if ($('tUndo')) $('tUndo').addEventListener('click', function () {
      if (window.confirm('이번 자리 비움 기록을 삭제할까요?')) { awayUndo(a.id); afterAway(p); }
    });
  }
  function afterAway(p) { renderTimerBox(p); APP.updateSeats($('map'), paintSeat); renderChk(); }

  // 1초마다 경과 시간 갱신 · 15분 경과 시 1회 알림
  setInterval(function () {
    if (!admin) return;
    var now = Date.now(), running = awayList.filter(function (a) { return !a.end; });
    running.forEach(function (a) {
      if (!a.alerted && now - a.start >= AWAY_LIMIT) {
        a.alerted = true; awaySave();
        toast('⏱ ' + a.name + ' 님 자리 비움 ' + AWAY_LIMIT_MIN + '분이 지났습니다.');
        try { if (navigator.vibrate) navigator.vibrate([300, 150, 300]); } catch (e) {}
        renderChk();
      }
    });
    if (running.length) APP.updateSeats($('map'), paintSeat);
    document.querySelectorAll('.tdur[data-s]').forEach(function (el) {
      var d = now - Number(el.dataset.s), over = d >= AWAY_LIMIT;
      el.textContent = fmtDur(d) + (over && el.dataset.long ? ' 초과' : '');
      el.classList.toggle('over', over);
    });
  }, 1000);

  // ---------- 직원 화면: 확인 목록 ----------
  var chkOn = true, chkTab = 'sign';
  try { chkOn = localStorage.getItem('chk_on') !== '0'; chkTab = localStorage.getItem('chk_tab') || 'sign'; } catch (e) {}
  function realPerson(p) {   // 생년월일·출석·좌석이 모두 없는 행(테스트 행)은 제외
    return !!(p.birth || p.s1 || p.s2 || p.s3 || p.seat);
  }
  function chkItem(p, sub, right) {
    return '<div class="chk-item" data-o="' + esc(p.o) + '"><div class="who"><b>' + esc(p.name) + '</b> <span class="muted">' + esc(p.birth || '') + '</span>' +
      '<span class="sub">' + sub + '</span></div>' + right + '</div>';
  }
  function callBtn(p) {
    return p.phone ? '<a class="call" href="tel:' + esc(p.phone) + '" title="' + esc(fmtPhone(p.phone)) + '">☎ 전화</a>' : '';
  }
  function renderChk() {
    if (!admin || !chkOn) return;
    var sess = data.session || 1;
    var all = (data.people || []).filter(function (p) { return realPerson(p) && !p.absent; });
    var noSign = all.filter(function (p) { return !p['s' + sess]; });
    var noSeat = all.filter(function (p) { return !p.seat && (p.s1 || p.s2 || p.s3); });
    var running = awayList.filter(function (a) { return !a.end; });
    var done = awayList.filter(function (a) { return a.end; });
    var overN = running.filter(function (a) { return Date.now() - a.start >= AWAY_LIMIT; }).length;
    $('chkSess').textContent = (data.sessionLabel || sess + '교시') + ' 기준 · ' + (data.t || '');
    $('cSign').textContent = noSign.length; $('cSeat').textContent = noSeat.length; $('cAway').textContent = running.length;
    $('cAway').classList.toggle('hot', overN > 0);
    document.querySelectorAll('.chk-tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.t === chkTab); });
    var byName = function (a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; };
    var h = '', note = '';
    if (chkTab === 'sign') {
      note = sess + '교시에 아직 서명하지 않은 분입니다(당일불참 제외). 이전 교시 출석자가 위에 표시됩니다.';
      noSign.sort(function (a, b) { return ((b.s1 || b.s2 || b.s3) ? 1 : 0) - ((a.s1 || a.s2 || a.s3) ? 1 : 0) || byName(a, b); });
      h = noSign.map(function (p) {
        var prev = [1, 2, 3].filter(function (k) { return k < sess && p['s' + k]; }).map(function (k) { return k + '교시 출석'; }).join(' · ');
        return chkItem(p, (p.seat ? APP.seatLabel(p.seat) : '좌석 없음') + (prev ? ' · ' + prev : sess > 1 ? ' · 이전 교시 미출석' : ''), callBtn(p));
      }).join('');
    } else if (chkTab === 'seat') {
      note = '서명(출석)은 했으나 좌석을 지정하지 않은 분입니다.';
      h = noSeat.sort(byName).map(function (p) { return chkItem(p, sessText(p), callBtn(p)); }).join('');
    } else {
      note = '수강생을 누른 뒤 「자리 비움 시작」을 누르면 측정됩니다. ' + AWAY_LIMIT_MIN + '분이 지나면 빨간색으로 표시됩니다. 기록은 이 기기에만 저장됩니다.';
      h = running.sort(function (a, b) { return a.start - b.start; }).map(function (a) {
        var el = Date.now() - a.start;
        return '<div class="chk-item" data-o="' + esc(a.o) + '"><div class="who"><b>' + esc(a.name) + '</b><span class="sub">' + (a.seat ? APP.seatLabel(a.seat) + ' · ' : '') + hm(a.start) + ' 나감</span></div>' +
          '<span class="tdur' + (el >= AWAY_LIMIT ? ' over' : '') + '" data-s="' + a.start + '">' + fmtDur(el) + '</span></div>';
      }).join('');
      if (done.length) {
        h += '<div class="chk-note" style="margin-top:10px"><b>복귀 기록</b></div>' + done.slice().sort(function (a, b) { return b.end - a.end; }).map(function (a) {
          var d = a.end - a.start;
          return '<div class="chk-item" data-o="' + esc(a.o) + '"><div class="who"><b>' + esc(a.name) + '</b><span class="sub">' + (a.sess ? a.sess + '교시 · ' : '') + hm(a.start) + ' → ' + hm(a.end) + '</span></div>' +
            '<span class="tdur' + (d > AWAY_LIMIT ? ' over' : '') + '" style="color:' + (d > AWAY_LIMIT ? '#d10000' : '#138a4a') + '">' + fmtDurKo(d) + (d > AWAY_LIMIT ? ' 초과' : '') + '</span></div>';
        }).join('');
      }
    }
    $('chkNote').textContent = note;
    $('chkTools').hidden = chkTab !== 'away' || !awayList.length;
    $('chkList').innerHTML = h || '<p class="muted" style="padding:8px 4px">해당하는 분이 없습니다.</p>';
  }
  $('chkList').addEventListener('click', function (e) {
    if (e.target.closest('a.call')) return;
    var it = e.target.closest('.chk-item'); if (!it) return;
    var o = it.dataset.o;
    var p = (data.people || []).filter(function (x) { return String(x.o) === o; })[0];
    if (p) openPerson(p);
  });
  document.querySelectorAll('.chk-tabs button').forEach(function (b) {
    b.addEventListener('click', function () {
      chkTab = b.dataset.t; try { localStorage.setItem('chk_tab', chkTab); } catch (e) {}
      renderChk();
    });
  });
  $('chkBtn').addEventListener('click', function () {
    chkOn = !chkOn; try { localStorage.setItem('chk_on', chkOn ? '1' : '0'); } catch (e) {}
    paint();
  });
  $('awayCopy').addEventListener('click', function () {
    var rows = [['회차', '성명', '생년월일', '좌석', '교시', '나감', '복귀', '자리 비움 시간', AWAY_LIMIT_MIN + '분 초과']];
    awayList.slice().sort(function (a, b) { return a.start - b.start; }).forEach(function (a) {
      var d = (a.end || Date.now()) - a.start;
      rows.push([data.round || '', a.name, a.birth || '', a.seat ? APP.seatLabel(a.seat) : '', a.sess ? a.sess + '교시' : '', hm(a.start), a.end ? hm(a.end) : '미복귀', fmtDurKo(d), d > AWAY_LIMIT ? '초과' : '']);
    });
    var txt = rows.map(function (r) { return r.join('\t'); }).join('\n');
    var done = function () { toast('기록을 복사했습니다. 엑셀에 붙여넣기 하세요.'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback); else fallback();
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { toast('복사하지 못했습니다.'); }
      ta.remove();
    }
  });

  $('moveCancel').addEventListener('click', function () { moving = null; $('moveBanner').classList.remove('show'); paint(); });

  function renderPick() {
    var q = ($('q').value || '').replace(/\s/g, '');
    var list = (data.people || []).filter(function (p) { return matchQ(p, q); });
    list.sort(function (a, b) { return (a.seat ? 1 : 0) - (b.seat ? 1 : 0) || (a.name < b.name ? -1 : 1); });
    $('pickList').innerHTML = list.slice(0, 100).map(function (p) {
      var st = sessText(p) + (p.seat ? ' · 현재 ' + APP.seatLabel(p.seat) : '');
      return '<div class="person"><div><b>' + esc(p.name) + '</b> <span class="muted">' + esc(p.birth) + '</span> ' + telHtml(p) + '<br><span class="muted">' + esc(st) + '</span></div>' +
        '<button type="button" data-o="' + esc(p.o) + '" data-n="' + esc(p.name) + '">' + (p.seat ? '이리로 이동' : '배정') + '</button></div>';
    }).join('') || '<p class="muted">대상이 없습니다.</p>';
    $('pickList').querySelectorAll('button[data-o]').forEach(function (b) {
      b.addEventListener('click', function () {
        seatOp({ op: 'assign', seat: sheetSeat, o: b.dataset.o }, b.dataset.n + ' → ' + APP.seatLabel(sheetSeat) + ' 배정했습니다.');
      });
    });
  }

  // ---------- 직원 모드: 명단·연락처 (미출석자에게 전화할 때 사용) ----------
  var listFilter = 'absent';
  function openList() {
    sheetSeat = null;
    $('sheetSub').textContent = '직원 전용 · 빔 화면에 띄우지 마세요';
    $('sheetTitle').textContent = '명단·연락처';
    $('sheetBody').innerHTML =
      '<input id="lq" type="search" placeholder="이름 또는 연락처 검색">' +
      '<div class="pfilter"><button type="button" data-f="absent">현재 교시 미출석</button><button type="button" data-f="dev">기기 다름</button><button type="button" data-f="all">전체</button></div>' +
      '<div id="pickList"></div>';
    $('lq').addEventListener('input', renderList);
    $('sheetBody').querySelectorAll('.pfilter button').forEach(function (b) {
      b.addEventListener('click', function () { listFilter = b.dataset.f; renderList(); });
    });
    renderList();
    $('sheetBg').classList.add('show');
  }
  function renderList() {
    if (!$('lq')) return;
    var sess = data.session || 1, q = ($('lq').value || '').replace(/\s/g, '');
    $('sheetBody').querySelectorAll('.pfilter button').forEach(function (b) { b.classList.toggle('on', b.dataset.f === listFilter); });
    var all = data.people || [];
    var list = all.filter(function (p) {
      var okF = listFilter === 'all' || (listFilter === 'dev' ? !!p.devFlag : (!p['s' + sess] && !p.absent));
      return okF && matchQ(p, q);
    });
    list.sort(function (a, b) { return (a.name < b.name ? -1 : a.name > b.name ? 1 : 0); });
    var headTx = listFilter === 'all' ? '전체 ' + all.length + '명'
      : listFilter === 'dev' ? '기기 다름 ' + all.filter(function (p) { return p.devFlag; }).length + '명'
      : sess + '교시 미출석 ' + all.filter(function (p) { return !p['s' + sess] && !p.absent; }).length + '명' +
        (all.some(function (p) { return p.absent; }) ? ' (당일불참 ' + all.filter(function (p) { return p.absent; }).length + '명 제외)' : '');
    var head = '<p class="muted">' + headTx + (q ? ' · 검색 결과 ' + list.length + '명' : '') + '</p>';
    $('pickList').innerHTML = head + (list.map(function (p) {
      var st = sessText(p) + (p.seat ? ' · ' + APP.seatLabel(p.seat) : ' · 좌석 미지정');
      return '<div class="person"><div><b>' + esc(p.name) + '</b> <span class="muted">' + esc(p.birth) + (p.org ? ' · ' + esc(p.org) : '') + '</span>' + devTagHtml(p.devFlag) + (p.absent ? '<span class="devtag" style="color:#d10000;border-color:#d10000;background:#fff1f1">당일불참</span>' : '') + '<br><span class="muted">' + esc(st) + '</span></div>' + telHtml(p) + '</div>';
    }).join('') || '<p class="muted">대상이 없습니다.</p>');
  }
  $('listBtn').addEventListener('click', openList);

  async function seatOp(body, okMsg) {
    try {
      var res = await api('adminSeat', Object.assign({ key: key }, body));
      toast(res.ok ? okMsg : (res.msg || '처리하지 못했습니다.'));
    } catch (e) { toast('연결 오류. 다시 시도해 주세요.'); }
    $('sheetBg').classList.remove('show');
    refresh();
  }
  function closeSheet() { personOpen = null; $('sheetBg').classList.remove('show'); }
  $('closeSheet').addEventListener('click', closeSheet);

  paint();
  refresh().finally(loop);
})();
</script>
</body>
</html>
