<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>서명부</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9ebef; color: #000; font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: #1d2129; color: #fff; font-size: 14px; }
  .bar input { width: 70px; padding: 6px 8px; border-radius: 6px; border: 0; font-size: 14px; }
  .bar button { border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 700; font-size: 14px; cursor: pointer; }
  .bar .p { background: #1f5fbf; color: #fff; }
  .bar .g { background: #138a4a; color: #fff; }
  .bar button:disabled { opacity: .6; cursor: default; }
  #saveMsg { width: 100%; font-size: 13px; }
  #saveMsg a { color: #9cc3ff; font-weight: 700; margin-left: 6px; }
  .bar .sp { flex: 1; }
  #msg { padding: 30px; text-align: center; font-size: 16px; }

  /* A4 가로 한 장 = 표 1개 (원본 서명부와 같은 열 구성) */
  .page { width: 297mm; height: 210mm; margin: 10mm auto; background: #fff; padding: 9mm 10mm; box-shadow: 0 2px 8px rgba(0,0,0,.15); display: flex; flex-direction: column; }
  .page h1 { text-align: center; font-size: 17pt; margin: 0 0 4mm; letter-spacing: .5px; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; flex: 1; }
  th, td { border: 1px solid #000; text-align: center; vertical-align: middle; font-size: 10.5pt; padding: 0 1.5mm; overflow: hidden; }
  th { background: #dde9f7; font-weight: 700; height: 8mm; }
  td { height: 10.1mm; }
  td.org { font-size: 9.5pt; }
  td.sg { padding: .6mm 1mm; }
  td.sg img { max-width: 100%; max-height: 9mm; display: block; margin: 0 auto; }
  col.c-no { width: 5%; } col.c-nm { width: 8%; } col.c-bd { width: 9%; } col.c-org { width: 30%; } col.c-s { width: 16%; }

  @media print {
    @page { size: A4 landscape; margin: 0; }
    body { background: #fff; }
    .bar, #msg { display: none !important; }
    .page { margin: 0; box-shadow: none; page-break-after: always; break-after: page; }
    .page:last-child { page-break-after: auto; break-after: auto; }
    th { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="bar">
  <b>서명부</b>
  <label>회차 <input id="round" type="text" inputmode="numeric" placeholder="자동"></label>
  <button class="p" id="loadBtn" type="button">불러오기</button>
  <span id="info"></span>
  <span class="sp"></span>
  <button class="g" id="saveBtn" type="button" disabled>서명부 폴더에 PDF 저장</button>
  <button class="p" id="printBtn" type="button">인쇄</button>
  <div id="saveMsg"></div>
</div>
<div id="msg">불러오는 중입니다…</div>
<div id="pages"></div>

<script src="config.js"></script>
<script src="assets/common.js"></script>
<script src="vendor/html2canvas.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script>
(function () {
  'use strict';
  var key = APP.staffKey(), esc = APP.esc;
  var ROWS_PER_PAGE = 17;
  var loaded = null;
  var $ = function (id) { return document.getElementById(id); };

  async function load() {
    if (!key) { $('msg').textContent = '직원용 링크(직원 현황판의 [서명부 인쇄])로 접속해 주세요.'; return; }
    $('msg').hidden = false; $('msg').textContent = '불러오는 중입니다… (서명 이미지가 많으면 10초 정도 걸릴 수 있습니다)';
    $('pages').innerHTML = '';
    try {
      var body = { key: key };
      if ($('round').value.trim()) body.round = $('round').value.trim();
      var res = await APP.api('signSheet', body, 60000);
      if (!res.ok) { $('msg').textContent = res.msg || '불러오지 못했습니다.'; return; }
      render(res);
      loaded = res;
      $('saveBtn').disabled = false;
      $('msg').hidden = true;
    } catch (e) {
      $('msg').textContent = '연결 오류입니다. 다시 불러와 주세요.';
    }
  }

  function render(res) {
    var cnt = [0, 0, 0];
    res.rows.forEach(function (r) { r.s.forEach(function (s, i) { if (s) cnt[i]++; }); });
    $('info').textContent = '오프라인 ' + res.round + '차 · ' + res.rows.length + '명 · 서명 ' + cnt.map(function (c, i) { return (i + 1) + '교시 ' + c; }).join(' / ');
    $('round').value = res.round;
    document.title = '서명부_오프라인' + res.round + '차';
    var html = '';
    for (var p = 0; p < Math.max(1, Math.ceil(res.rows.length / ROWS_PER_PAGE)); p++) {
      var part = res.rows.slice(p * ROWS_PER_PAGE, (p + 1) * ROWS_PER_PAGE);
      html += '<section class="page">' + (p === 0 ? '<h1>[' + esc(res.title) + '] 교육생명단</h1>' : '') +
        '<table><colgroup><col class="c-no"><col class="c-nm"><col class="c-bd"><col class="c-org"><col class="c-s"><col class="c-s"><col class="c-s"></colgroup>' +
        '<thead><tr><th>연번</th><th>성명</th><th>생년월일</th><th>소속</th><th>1교시</th><th>2교시</th><th>3교시</th></tr></thead><tbody>';
      part.forEach(function (r) {
        html += '<tr><td>' + r.no + '</td><td>' + esc(r.name) + '</td><td>' + esc(r.birth) + '</td><td class="org">' + esc(r.org) + '</td>' +
          r.s.map(function (s) { return '<td class="sg">' + (s ? '<img alt="서명" src="' + esc(s) + '">' : '') + '</td>'; }).join('') + '</tr>';
      });
      for (var k = part.length; k < ROWS_PER_PAGE; k++) html += '<tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>';
      html += '</tbody></table></section>';
    }
    $('pages').innerHTML = html;
  }

  // ---------- 화면의 서명부를 그대로 PDF로 만들어 드라이브 「서명부」 폴더에 저장 ----------
  async function savePdf() {
    if (!loaded) return;
    if (!window.html2canvas || !window.jspdf) { $('saveMsg').textContent = 'PDF 도구(vendor 폴더의 html2canvas.min.js, jspdf.umd.min.js)를 불러오지 못했습니다.'; return; }
    var btn = $('saveBtn'); btn.disabled = true;
    var pages = Array.prototype.slice.call(document.querySelectorAll('#pages .page'));
    try {
      var pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4', compress: true });
      for (var i = 0; i < pages.length; i++) {
        $('saveMsg').textContent = 'PDF 만드는 중… (' + (i + 1) + '/' + pages.length + '쪽)';
        var shadow = pages[i].style.boxShadow; pages[i].style.boxShadow = 'none';
        var canvas = await window.html2canvas(pages[i], { scale: 2, backgroundColor: '#ffffff', logging: false });
        pages[i].style.boxShadow = shadow;
        if (i) pdf.addPage('a4', 'landscape');
        pdf.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 297, 210);
      }
      $('saveMsg').textContent = '드라이브에 저장하는 중…';
      var dataUrl = pdf.output('datauristring');
      var res = await APP.api('saveSignPdf', { key: key, round: loaded.round, pdf: dataUrl }, 120000);
      if (!res.ok) { $('saveMsg').textContent = res.msg || '저장하지 못했습니다.'; return; }
      $('saveMsg').innerHTML = esc(res.time) + ' 저장 완료: ' + esc(res.name) +
        ' <a href="' + esc(res.url) + '" target="_blank" rel="noopener">파일 열기</a>' +
        ' <a href="' + esc(res.folderUrl) + '" target="_blank" rel="noopener">서명부 폴더 열기</a>';
    } catch (e) {
      $('saveMsg').textContent = '저장 중 오류가 발생했습니다. 다시 눌러 주세요. (' + (e && e.message ? e.message : e) + ')';
    } finally {
      btn.disabled = false;
    }
  }

  $('saveBtn').addEventListener('click', savePdf);
  $('loadBtn').addEventListener('click', load);
  $('printBtn').addEventListener('click', function () { window.print(); });
  load();
})();
</script>
</body>
</html>
